# Production stack — single origin (ledgerly.ccsit.co), path-based routing
# via the shared Caddy instance over the external `edge` network. No source
# bind-mounts, no --reload, no Odoo (that's a local-only ERP test fixture).
#
# Keycloak note: the `command` below is the permanent, safe value. On the
# very first deploy, temporarily override it to `start --import-realm` to
# load infra/keycloak/realm-export.prod.json, confirm the realm/clients
# exist, then switch back to `start` and restart — `--import-realm` uses
# OVERWRITE_EXISTING and will wipe users on every subsequent restart if left in.

services:
  postgres:
    image: postgres:16-alpine
    container_name: ledgerly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default

  redis:
    image: redis:7-alpine
    container_name: ledgerly-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default

  minio:
    image: minio/minio:latest
    container_name: ledgerly-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default
      - edge

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb -p local/${MINIO_BUCKET} || true &&
      exit 0
      "
    networks:
      - default

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: ledgerly-keycloak
    restart: unless-stopped
    command: start
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: ledgerly.ccsit.co
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded
    volumes:
      - ./infra/keycloak/realm-export.prod.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - edge

  backend:
    build: ./backend
    container_name: ledgerly-backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    networks:
      - default
      - edge

  worker:
    build: ./backend
    container_name: ledgerly-worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: celery -A app.workers.celery_app worker --loglevel=INFO
    networks:
      - default

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: https://ledgerly.ccsit.co/api
        VITE_KEYCLOAK_URL: https://ledgerly.ccsit.co/auth
        VITE_KEYCLOAK_REALM: ledgerly
        VITE_KEYCLOAK_CLIENT_ID: ledgerly-frontend
    container_name: ledgerly-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - default
      - edge

  mailhog:
    image: mailhog/mailhog:latest
    container_name: ledgerly-mailhog
    restart: unless-stopped
    networks:
      - default

volumes:
  postgres_data:
  minio_data:

networks:
  default: {}
  # Shared network so Caddy (in the finops-agent / trimtab stack) can route
  # to this project's containers by name, without exposing them beyond the
  # host or joining each other's compose projects.
  edge:
    external: true
